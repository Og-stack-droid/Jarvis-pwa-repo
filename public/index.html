<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JARVIS</title>
    <meta name="theme-color" content="#050b16" />
    <meta name="description" content="Voice-first offline-capable AI assistant" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <div id="backdrop" class="backdrop" hidden></div>
      <aside id="sidebar" class="sidebar" aria-label="Conversations and settings">
        <div class="brand">
          <span class="orb small"></span>
          <div>
            <strong>JARVIS</strong>
            <span class="sub" id="modelBadge">loading…</span>
          </div>
        </div>
        <button id="newChat" class="ghost-btn">+ New conversation</button>
        <div id="chatList" class="chat-list"></div>
        <div class="settings">
          <label class="row">
            <span>Model</span>
            <select id="modelSelect"></select>
          </label>
          <label class="row">
            <span>Speak replies</span>
            <input type="checkbox" id="ttsToggle" checked />
          </label>
          <label class="row">
            <span>Wake word "Jarvis"</span>
            <input type="checkbox" id="wakeToggle" />
          </label>
          <label class="col">
            <span>Persona / system prompt</span>
            <textarea id="systemPrompt" rows="4"></textarea>
          </label>
          <button id="installBtn" class="ghost-btn" hidden>Install app</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
          <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">connecting…</span></div>
          <button id="clearBtn" class="icon-btn" aria-label="Clear conversation">⟲</button>
        </header>

        <section id="messages" class="messages">
          <div class="hero">
            <div class="orb"></div>
            <h1>Good day. I am JARVIS.</h1>
            <p>Ask me anything by text or voice. Everything runs locally on your machine.</p>
            <div class="suggestions">
              <button class="chip">Summarise the last week in AI</button>
              <button class="chip">Write a Python script to rename files</button>
              <button class="chip">Explain quantum tunnelling simply</button>
              <button class="chip">Draft a polite follow-up email</button>
            </div>
          </div>
        </section>

        <button id="scrollBtn" class="scroll-btn" hidden aria-label="Scroll to latest">↓</button>

        <form id="composer" class="composer">
          <button type="button" id="micBtn" class="mic-btn" aria-label="Voice input">🎙</button>
          <textarea id="input" rows="1" placeholder="Message JARVIS…  (Enter to send, Shift+Enter for newline)"></textarea>
          <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">➤</button>
          <button type="button" id="stopBtn" class="send-btn stop" hidden aria-label="Stop">■</button>
        </form>
        <div id="offlineBar" class="offline-bar" hidden>Offline — replies resume when the connection returns.</div>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
